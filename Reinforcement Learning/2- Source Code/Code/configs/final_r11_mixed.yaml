environment:
  max_timesteps: 500
  max_queue: 40
  yellow_duration: 2
  service_rate: 2

traffic:
  scenario: mixed_scenarios
  training_scenarios: low_uniform,uniform_medium,high_uniform,uneven,rush_hour
  arrival_rates:
    north: 0.30
    south: 0.30
    east: 0.30
    west: 0.30

reward:
  type: R11
  w1: 0.48428457611594394
  w2: 0.01686242633086334
  w3: 0.49885299755319273
  w4: 0.75
  base_reward_type: R7
  alpha_reward: 1.0
  beta_reward: 0.0
  throughput_weight: 0.0
  use_composite_reward: true

training:
  episodes: 12000
  learning_rate: 0.1
  discount_factor: 0.95
  epsilon_start: 1.0
  epsilon_decay: 0.999
  epsilon_min: 0.01
  seed: 42

dqn:
  episodes: 8000
  learning_rate: 0.0005
  discount_factor: 0.97
  epsilon_start: 1.0
  epsilon_decay: 0.9995
  epsilon_min: 0.05
  replay_capacity: 100000
  batch_size: 128
  hidden_size: 128
  target_update_steps: 500
  warmup_steps: 2000
  gradient_clip: 5.0

evaluation:
  episodes: 100
  epsilon: 0.0
  seed_offsets: 10000,20000,30000

fixed_time:
  green_duration: 20

visualization:
  agent: fixed_time
  max_steps: 160
  fps: 6
